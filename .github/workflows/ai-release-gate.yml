name: AI release gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: AI Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Block committed secrets
        run: pnpm run security:scan

      - name: Block high-risk dependencies
        run: pnpm run security:audit

      - name: Build static website
        run: pnpm run build:site

      - name: Install browser for mobile and form checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Test forms, links and mobile layouts
        run: pnpm run qa:release

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-release-gate-evidence
          path: output/ai-release-gate/
          if-no-files-found: warn
