name: AI release gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: AI Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Block committed secrets
        run: pnpm run security:scan

      - name: Block high-risk dependencies
        run: pnpm run security:audit

      - name: Build static website
        run: pnpm run build:site

      - name: Install browser for mobile and form checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Test forms, links and mobile layouts
        run: pnpm run qa:release

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-release-gate-evidence
          path: output/ai-release-gate/
          if-no-files-found: warn
